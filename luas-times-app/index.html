<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Luas Live</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  :root { --red:#c8102e; --green:#00a651; --bg:#f6f6f4; --card:#fff; --text:#1d1d1d; --muted:#6b6b6b; --line:#e3e3e0; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#141414; --card:#1f1f1f; --text:#eee; --muted:#9a9a9a; --line:#333; }
  }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,sans-serif; background:var(--bg); color:var(--text); }
  header { padding:16px; max-width:900px; margin:auto; }
  h1 { margin:0 0 4px; font-size:1.5rem; }
  .meta { color:var(--muted); font-size:.85rem; }
  .tabs { display:flex; gap:8px; margin:12px 0; }
  .tabs button { flex:1; padding:10px; border:2px solid var(--line); border-radius:8px; background:var(--card); color:var(--text); font-weight:600; cursor:pointer; }
  .tabs button.on[data-line=red] { border-color:var(--red); background:var(--red); color:#fff; }
  .tabs button.on[data-line=green] { border-color:var(--green); background:var(--green); color:#fff; }
  input { width:100%; padding:10px; border:1px solid var(--line); border-radius:8px; background:var(--card); color:var(--text); font-size:1rem; }
  #msg { margin-top:10px; font-size:.9rem; }
  main { max-width:900px; margin:auto; padding:0 16px 32px; }
  .stop { background:var(--card); border:1px solid var(--line); border-left:5px solid var(--accent); border-radius:8px; padding:12px; margin-bottom:10px; }
  .stop h2 { margin:0 0 8px; font-size:1.05rem; }
  .dirs { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .dir h3 { margin:0 0 4px; font-size:.8rem; text-transform:uppercase; color:var(--muted); }
  .tram { display:flex; justify-content:space-between; font-size:.9rem; padding:2px 0; }
  .due { font-weight:700; }
  .now { color:var(--accent); }
  .none { color:var(--muted); font-size:.85rem; }
  .err { color:var(--red); }
  #map { height:340px; border-radius:8px; border:1px solid var(--line); margin-bottom:12px; }
  .stop.hl { outline:3px solid var(--accent); }
  .panel { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:12px; }
  @media (max-width:600px) { .panel { grid-template-columns:1fr; } }
  .sla, .ai { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:12px; }
  .sla { display:flex; gap:12px; align-items:center; }
  .sla-num { font-size:2.2rem; font-weight:800; min-width:90px; }
  .sla-label { font-weight:700; }
  .ok { color:var(--green); } .warn { color:#d98b00; } .bad { color:var(--red); }
  #aiBtn { padding:8px 12px; border:none; border-radius:6px; background:var(--accent); color:#fff; font-weight:600; cursor:pointer; margin-bottom:8px; }
  #aiBtn:disabled { opacity:.6; cursor:wait; }
  #aiOut { color:var(--text); font-size:.9rem; line-height:1.4; }
  .flag { display:inline-block; margin-left:6px; padding:1px 6px; border-radius:4px; background:#f5a623; color:#000; font-size:.7rem; text-transform:none; }
</style>
</head>
<body>
<header>
  <h1>Luas Live</h1>
  <div class="meta" id="updated">Loading…</div>
  <div class="tabs">
    <button data-line="red">Red Line</button>
    <button data-line="green">Green Line</button>
  </div>
  <input id="filter" placeholder="Filter stops…">
  <div id="msg"></div>
  <div class="panel">
    <div class="sla">
      <div class="sla-num" id="slaNum">–</div>
      <div>
        <div class="sla-label">Service level</div>
        <div class="meta" id="slaDetail">Trams within 15 min · target 90%</div>
      </div>
    </div>
    <div class="ai">
      <button id="aiBtn">Summarise</button>
      <div id="aiOut" class="meta">Quick status of the line.</div>
    </div>
  </div>
</header>
<main>
  <div id="map"></div>
  <div id="stops"></div>
</main>

<script>
const RELAY = "https://luas-class.kluxy.app";
let line = "green";
let data = null;

// Flag a direction if the next tram, or the gap to the one after, is 15+ min.
// The feed has no timetable, so this stands in for "late".
const GAP = 15;
function longGap(trams) {
  if (!trams.length) return false;
  if (trams[0].due >= GAP) return true;
  return trams.length > 1 && trams[1].due - trams[0].due >= GAP;
}

function render() {
  const box = document.getElementById("stops");
  if (!data) return;
  const q = document.getElementById("filter").value.toLowerCase();
  const accent = line === "red" ? "var(--red)" : "var(--green)";
  document.documentElement.style.setProperty("--accent", accent);

  // Show the service message once (first stop's message)
  const m = data.stops[0]?.message || "";
  document.getElementById("msg").textContent = m;

  box.innerHTML = data.stops
    .filter(s => s.name.toLowerCase().includes(q))
    .map(s => `
      <div class="stop" id="stop-${s.id}">
        <h2>${s.name}</h2>
        <div class="dirs">
          ${s.directions.map(d => `
            <div class="dir">
              <h3>${d.name}${longGap(d.trams) ? `<span class="flag">Long gap</span>` : ""}</h3>
              ${d.trams.length
                ? d.trams.slice(0, 3).map(t => `
                    <div class="tram">
                      <span>${t.destination}</span>
                      <span class="due ${t.due <= 1 ? "now" : ""}">${t.due <= 0 ? "Due" : t.due + " min"}</span>
                    </div>`).join("")
                : `<div class="none">No trams forecast</div>`}
            </div>`).join("")}
        </div>
      </div>`).join("");

  drawMap();
  drawSLA();
}

// ---- Service level (WFM-style SLA) ----
// Each stop-direction with trams forecast counts once.
// "Met" = next tram within 15 min and no long gap to the following one.
const TARGET = 90;
function drawSLA() {
  let total = 0, met = 0;
  const misses = [];
  data.stops.forEach(s => s.directions.forEach(d => {
    if (!d.trams.length) return;
    total++;
    if (longGap(d.trams)) misses.push(`${s.name} (${d.name})`); else met++;
  }));
  const el = document.getElementById("slaNum");
  if (!total) { el.textContent = "–"; return; }
  const pct = Math.round(met / total * 100);
  el.textContent = pct + "%";
  el.className = "sla-num " + (pct >= TARGET ? "ok" : pct >= TARGET - 15 ? "warn" : "bad");
  document.getElementById("slaDetail").textContent =
    `${met} of ${total} on time · target ${TARGET}%` +
    (misses.length ? ` · gaps at: ${misses.slice(0, 4).join(", ")}${misses.length > 4 ? "…" : ""}` : "");
}

// ---- AI summary via the class relay's /chat ----
// Only runs on button press, to go easy on the shared relay.
async function summarise() {
  if (!data) return;
  const btn = document.getElementById("aiBtn"), out = document.getElementById("aiOut");
  btn.disabled = true; out.textContent = "Thinking…";
  const compact = data.stops.map(s =>
    `${s.name}: ` + s.directions.map(d =>
      `${d.name} ${d.trams.length ? d.trams.slice(0, 3).map(t => t.due).join("/") + " min" : "none"}${longGap(d.trams) ? " [LONG GAP]" : ""}`
    ).join("; ")
  ).join("\n");
  const prompt =
    `You are a Luas service controller. Here are live forecasts for the ${line} line ` +
    `(minutes until the next trams at each stop, by direction). Service message: "${data.stops[0]?.message || ""}". ` +
    `Service level right now: ${document.getElementById("slaNum").textContent}.\n\n${compact}\n\n` +
    `In ONE or TWO short sentences, max 35 words, plain English: say how the line is running overall, ` +
    `name any stops with long gaps. No bullet points, no filler.`;
  try {
    const res = await fetch(`${RELAY}/chat`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ messages: [{ role: "user", content: prompt }] })
    });
    const j = await res.json();
    out.textContent = j.reply || "No reply from the class AI.";
  } catch (e) {
    out.textContent = "Couldn't reach the class AI. Try again in a moment.";
  }
  btn.disabled = false;
}
document.getElementById("aiBtn").onclick = summarise;

// ---- Map ----
const map = L.map("map").setView([53.34, -6.26], 12);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 18, attribution: "© OpenStreetMap contributors"
}).addTo(map);
const markers = L.layerGroup().addTo(map);
let fitFor = null; // which line the map was last zoomed to

function nextText(s) {
  return s.directions.map(d =>
    `<b>${d.name}:</b> ` + (d.trams.length
      ? d.trams.slice(0, 2).map(t => `${t.destination} ${t.due <= 0 ? "Due" : t.due + " min"}`).join(", ")
      : "none")
  ).join("<br>");
}

function drawMap() {
  markers.clearLayers();
  const colour = line === "red" ? "#c8102e" : "#00a651";
  const pts = [];
  data.stops.forEach(s => {
    const gap = s.directions.some(d => longGap(d.trams));
    pts.push([s.lat, s.lng]);
    L.circleMarker([s.lat, s.lng], {
      radius: gap ? 9 : 7,
      color: gap ? "#f5a623" : colour,
      fillColor: gap ? "#f5a623" : colour,
      fillOpacity: 0.9, weight: 2
    })
    .bindPopup(`<b>${s.name}</b>${gap ? " ⚠ Long gap" : ""}<br>${nextText(s)}`)
    .on("click", () => {
      const el = document.getElementById("stop-" + s.id);
      if (!el) return;
      document.querySelectorAll(".stop.hl").forEach(x => x.classList.remove("hl"));
      el.classList.add("hl");
      el.scrollIntoView({ behavior: "smooth", block: "center" });
    })
    .addTo(markers);
  });
  // Only zoom to the line when it changes, so refreshes don't jump the view
  if (fitFor !== line && pts.length) { map.fitBounds(pts, { padding: [20, 20] }); fitFor = line; }
}

async function load() {
  try {
    const res = await fetch(`${RELAY}/network?line=${line}`);
    data = await res.json();
    const t = new Date(data.fetched).toLocaleTimeString("en-IE");
    document.getElementById("updated").textContent = `Updated ${t} · refreshes every 30s`;
    render();
  } catch (e) {
    document.getElementById("updated").innerHTML = `<span class="err">Couldn't reach the relay. Retrying…</span>`;
  }
}

document.querySelectorAll(".tabs button").forEach(b => {
  b.onclick = () => {
    line = b.dataset.line;
    document.querySelectorAll(".tabs button").forEach(x => x.classList.toggle("on", x === b));
    data = null;
    document.getElementById("stops").innerHTML = "";
    document.getElementById("aiOut").textContent = "Quick status of the line.";
    load();
  };
});
document.getElementById("filter").oninput = render;
document.querySelector(`[data-line=${line}]`).classList.add("on");

load();
setInterval(load, 30000);
</script>
</body>
</html>
